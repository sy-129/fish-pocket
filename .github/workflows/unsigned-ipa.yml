# 出未签名 IPA：同 ios-build.yml 的依赖步骤，但目标换成 generic/platform=iOS，
# archive 时关掉签名，最后把 .app 装进 Payload/ 打成 ipa 传成 artifact。
# 产物没签名，装到 iPhone 上要靠 Sideloadly / AltStore 用自己的证书重签。
name: Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      purge:
        description: "构建前把 dsh-purge 补丁打进 engine（0/1）"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Purge patch (optional)
        if: ${{ inputs.purge == '1' }}
        run: |
          if [ -f scripts/patch-purge.sh ]; then
            scripts/patch-purge.sh engine
          else
            echo "scripts/patch-purge.sh 不存在，跳过";
          fi

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      - name: Archive (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DshIOS.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee ../archive.log | tail -80

      - name: Verify unsigned archive baseline
        run: |
          set -euo pipefail
          APP=$(find app/build/DshIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BIN="$APP/$EXE"
          test -f "$BIN"
          echo "archive main executable: $(stat -f%z "$BIN") bytes"
          otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' || echo "archive executable has no LC_CODE_SIGNATURE (expected before post-build signing)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.wsw.dsh-ios"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.2.1"

      # Xcode 27 的 SDK 禁用 ad-hoc 签名（"Ad Hoc code signing is not allowed"），
      # 所以只能 CODE_SIGNING_ALLOWED=NO + 事后签。
      # 顺序很关键：先用 codesign 递签整包（生成正确 CodeResources），
      # 最后用 ldid 单独重签主程序 —— ldid 会把签名槽按 0x4000 对齐撑大并留 pad，
      # 这样侧载工具重签时不必扩槽改 Mach-O，也就不会再报 CodeDirectory 不一致。
      # 代价：主程序的 CodeResources 条目失效，侧载工具重签时会自己重算。
      - name: Sign and pad main executable
        run: |
          set -euo pipefail
          APP=$(find app/build/DshIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BIN="$APP/$EXE"
          echo "binary=$BIN"

          echo "=== 1) codesign 递签整包 ==="
          find "$APP" -depth -type d \( -name '*.framework' -o -name '*.appex' \) -print0 \
            | xargs -0 -n1 echo \
            | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2- \
            | while IFS= read -r bundle; do codesign --force --sign - --timestamp=none "$bundle"; done
          find "$APP" -depth -type d -name '*.app' ! -path "$APP" -print0 \
            | xargs -0 -n1 echo \
            | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2- \
            | while IFS= read -r bundle; do codesign --force --sign - --timestamp=none "$bundle"; done
          codesign --force --sign - --timestamp=none "$APP"
          echo "  after codesign: $(stat -f%z "$BIN") bytes"
          otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' | tail -3 || true

          echo "=== 2) ldid 重签主程序，撑大签名槽 ==="
          command -v ldid >/dev/null || brew install ldid
          ENT=/tmp/empty.entitlements
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict/></plist>' > "$ENT"
          ldid -S"$ENT" "$BIN"
          echo "  final: $(stat -f%z "$BIN") bytes"

          echo "=== 3) 签名槽与余量 ==="
          otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' | tail -4 || true
          DOFF=$(otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' | awk '/dataoff/{print $2}')
          DSIZE=$(otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' | awk '/datasize/{print $2}')
          FS=$(stat -f%z "$BIN")
          TAIL=$((FS - DOFF - DSIZE))
          echo "  sig_off=$DOFF  sig_size=$DSIZE  filesize=$FS  tail_pad=$TAIL"
          test -n "$DOFF" && test -n "$DSIZE"
          test "$DSIZE" -ge 200000
          test "$TAIL" -ge 16384

      - name: Package IPA
        run: |
          APP=$(find app/build/DshIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DshIOS-unsigned.ipa Payload
          ls -lh DshIOS-unsigned.ipa
          echo "SHA256: $(shasum -a 256 DshIOS-unsigned.ipa)"
          python3 - <<'PYVALIDATE'
          import json, plistlib, zipfile
          ipa = zipfile.ZipFile("DshIOS-unsigned.ipa")
          names = set(ipa.namelist())
          root = "Payload/DshIOS.app/"
          assert root + "DshIOS" in names, "main executable missing from IPA"
          info = plistlib.loads(ipa.read(root + "Info.plist"))
          assert info["CFBundleIdentifier"] == "com.wsw.dsh-ios", info
          assert float(info["MinimumOSVersion"]) <= 17.0, info
          assert info["CFBundleShortVersionString"] == "1.2.1", info
          prefix = root + "nodejs-project/node_modules/"
          dsh = json.loads(ipa.read(prefix + "@deepseek-ai/dsh/package.json"))
          version = dsh["version"]
          assert version.startswith("0.2."), version
          cordis = [n for n in names if n.startswith(prefix) and n.endswith("/cordis/package.json")]
          assert cordis, "no cordis package found under bundled node_modules"
          print("IPA validation:", {"bundle_id": info["CFBundleIdentifier"], "minimum_os": info["MinimumOSVersion"], "app_version": info["CFBundleShortVersionString"], "dsh_version": version, "cordis_packages": len(cordis)})
          PYVALIDATE

      - uses: actions/upload-artifact@v4
        with:
          name: DshIOS-unsigned-ipa
          path: DshIOS-unsigned.ipa
          retention-days: 30
