# 出未签名 IPA：同 ios-build.yml 的依赖步骤，但目标换成 generic/platform=iOS，
# archive 时关掉签名，最后把 .app 装进 Payload/ 打成 ipa 传成 artifact。
# 产物没签名，装到 iPhone 上要靠 Sideloadly / AltStore 用自己的证书重签。
name: Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      purge:
        description: "构建前把 dsh-purge 补丁打进 engine（0/1）"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Purge patch (optional)
        if: ${{ inputs.purge == '1' }}
        run: |
          if [ -f scripts/patch-purge.sh ]; then
            scripts/patch-purge.sh engine
          else
            echo "scripts/patch-purge.sh 不存在，跳过";
          fi

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      - name: Archive (unsigned)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DshIOS.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -80

      # 关键：archive 时用了 CODE_SIGNING_ALLOWED=NO，只有主可执行是裸的，
      # 而 Frameworks 里 100 多个 Python/NodeMobile 框架都带着上游的 ad-hoc 签名。
      # 侧载工具做递归校验时主程序没有 CodeDirectory，会报
      # 「embedded 完整性校验失败 / 密封资源丢失」。
      # 这里从最内层往外给每个 bundle 补 ad-hoc 签名，让整包签名状态一致。
      - name: Ad-hoc sign (inside-out)
        run: |
          set -euo pipefail
          APP=$(find app/build/DshIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"

          # 按路径长度倒序 = 最深的最先签，天然的由内向外
          find "$APP" -type d \( -name '*.framework' -o -name '*.appex' -o -name '*.app' \) -print \
            | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2- \
            | while IFS= read -r b; do
                codesign --force --sign - --timestamp=none "$b" >/dev/null 2>&1 \
                  && echo "  ok  $b" || echo "  ERR $b"
              done

          # 独立的 dylib / so
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print \
            | while IFS= read -r f; do
                codesign --force --sign - --timestamp=none "$f" >/dev/null 2>&1 \
                  && echo "  ok  $f" || echo "  ERR $f"
              done

          # 最后签主 app 本体
          codesign --force --sign - --timestamp=none "$APP"
          echo
          echo "=== 主 app 签名信息 ==="
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20
          echo
          echo "=== 深度校验 ==="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -20 || true

      # 真正的问题不是"没签名"：codesign 把签名紧贴文件末尾，尾部剩余 0 字节。
      # 侧载工具的证书签名（含 CMS 证书链）更大，只能扩槽改 Mach-O，
      # 改完 CodeDirectory 覆盖范围与实际不符，报「CodeDirectory 与 Mach-O 不一致」。
      # 对策：先用 ldid 把主程序的签名槽撑到 0x4000 对齐并留 pad，
      # 再让 codesign 复用这个已放大的槽签整包（codesign 空间够就不缩回）。
      - name: Pad signature slot with ldid
        run: |
          set -euo pipefail
          APP=$(find app/build/DshIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BIN="$APP/$EXE"
          ENT=/tmp/empty.entitlements
          echo "binary=$BIN"

          command -v ldid >/dev/null || brew install ldid

          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict/></plist>' > "$ENT"

          echo "=== 1) 撑大主程序签名槽 ==="
          echo "  before: $(stat -f%z "$BIN") bytes"
          codesign --remove-signature "$BIN" || true
          ldid -S"$ENT" "$BIN"
          echo "  after : $(stat -f%z "$BIN") bytes"
          otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' || true

          echo "=== 2) 递归签整包（复用已放大的槽）==="
          find "$APP" -type d \( -name '*.framework' -o -name '*.appex' -o -name '*.app' \) -print \
            | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2- \
            | while IFS= read -r b; do codesign --force --sign - --timestamp=none "$b" >/dev/null 2>&1 || true; done
          codesign --force --sign - --timestamp=none "$APP"

          echo "=== 3) 结果 ==="
          echo "  final: $(stat -f%z "$BIN") bytes"
          otool -l "$BIN" | grep -A4 'LC_CODE_SIGNATURE' || true
          codesign -d --verbose=2 "$APP" 2>&1 | head -12 || true
          echo "=== 4) 校验 ==="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -8 || true

      - name: Package IPA
        run: |
          APP=$(find app/build/DshIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DshIOS-unsigned.ipa Payload
          ls -lh DshIOS-unsigned.ipa
          echo "SHA256: $(shasum -a 256 DshIOS-unsigned.ipa)"

      - uses: actions/upload-artifact@v4
        with:
          name: DshIOS-unsigned-ipa
          path: DshIOS-unsigned.ipa
          retention-days: 30
